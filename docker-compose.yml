version: '3.9'

services:
  # ============================================================================
  # PostgreSQL - Primary relational database (Identity Service + others)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mythfood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mythfood}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      POSTGRES_DB: ${DB_NAME:-mythfood_identity}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mythfood -d mythfood_identity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mythfood-network

  # ============================================================================
  # Redis - Cache, distributed lock, session store
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: mythfood-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-mythfood_redis_secret_dev}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mythfood-network

  # ============================================================================
  # Identity Service (NestJS)
  # ============================================================================
  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    container_name: mythfood-identity-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_IDENTITY:-mythfood_identity}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_IDENTITY:-dev_jwt_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET_IDENTITY:-dev_refresh_secret_change_me}
      JWT_EXPIRATION: 1h
      JWT_REFRESH_EXPIRATION: 7d
      REDIS_URL: redis://default:${REDIS_PASSWORD:-mythfood_redis_secret_dev}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Consumer Service (NestJS)
  # ============================================================================
  consumer-service:
    build:
      context: .
      dockerfile: apps/consumer-service/Dockerfile
    container_name: mythfood-consumer-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_CONSUMER:-mythfood_consumer}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_CONSUMER:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Merchant Service (NestJS)
  # ============================================================================
  merchant-service:
    build:
      context: .
      dockerfile: apps/merchant-service/Dockerfile
    container_name: mythfood-merchant-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_MERCHANT:-mythfood_merchant}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_MERCHANT:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Order Service (NestJS)
  # ============================================================================
  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: mythfood-order-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_ORDER:-mythfood_order}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_ORDER:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Inventory Service (NestJS)
  # ============================================================================
  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: mythfood-inventory-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_INVENTORY:-mythfood_inventory}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_INVENTORY:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Payment Service (NestJS)
  # ============================================================================
  payment-service:
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
    container_name: mythfood-payment-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_PAYMENT:-mythfood_payment}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_PAYMENT:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Driver Service (NestJS)
  # ============================================================================
  driver-service:
    build:
      context: .
      dockerfile: apps/driver-service/Dockerfile
    container_name: mythfood-driver-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_DRIVER:-mythfood_driver}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_DRIVER:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Dispatch Service (NestJS)
  # ============================================================================
  dispatch-service:
    build:
      context: .
      dockerfile: apps/dispatch-service/Dockerfile
    container_name: mythfood-dispatch-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_DISPATCH:-mythfood_dispatch}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_DISPATCH:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Wallet Service (NestJS) - Quản lý ví Driver, Consumer, Merchant, Platform, Tax
  # ============================================================================
  wallet-service:
    build:
      context: .
      dockerfile: apps/wallet-service/Dockerfile
    container_name: mythfood-wallet-service
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: development
      PORT: 3009
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME_WALLET:-mythfood_wallet}
      DATABASE_USER: ${DB_USER:-mythfood}
      DATABASE_PASSWORD: ${DB_PASSWORD:-mythfood_secret_dev}
      JWT_SECRET: ${JWT_SECRET_WALLET:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2023-10-16}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mythfood-network

  # ============================================================================
  # Upload Service (NestJS) - File upload handling (local/S3)
  # ============================================================================
  upload-service:
    build:
      context: .
      dockerfile: apps/upload-service/Dockerfile
    container_name: mythfood-upload-service
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: development
      PORT: 3010
      JWT_SECRET: ${JWT_SECRET_UPLOAD:-dev_jwt_secret_change_me}
      JWT_EXPIRATION: 1h
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./uploads
      STORAGE_MAX_FILE_SIZE: 5242880
      STORAGE_ALLOWED_TYPES: image/jpeg,image/png,image/webp
      UPLOAD_BASE_URL: http://localhost:3010
    volumes:
      - upload_data:/app/uploads
    networks:
      - mythfood-network

  # =============================================================================
  # Kafka - Event-driven communication between services (FIX #15)
  # Uncomment to enable. Requires 4GB+ RAM free.
  # =============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mythfood-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - mythfood-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mythfood-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - mythfood-network

volumes:
  postgres_data:
    name: mythfood_postgres_data
  redis_data:
    name: mythfood_redis_data
  upload_data:
    name: mythfood_upload_data
  zookeeper_data:
    name: mythfood_zookeeper_data
  kafka_data:
    name: mythfood_kafka_data

networks:
  mythfood-network:
    name: mythfood-network
    driver: bridge